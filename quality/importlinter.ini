; quality/importlinter.ini — the layering of docs/CONVENTIONS.md as checked contracts.
; source -> surface AST -> desugar -> core AST -> semantics; the arrows must not run back.
; fpl.asm stands apart: nothing in it imports the rest of fpl.

[importlinter]
root_package = fpl
include_external_packages = True
; forbidden_once_present: `forbidden` for a package that may not exist yet
; (quality/noslop_contracts.py).
contract_types =
    forbidden_once_present: noslop_contracts.ForbiddenOncePresent

[importlinter:contract:parse-has-no-semantics]
name = parse.py holds no semantics: it knows the grammar and the surface AST, nothing after
type = forbidden
source_modules = fpl.parse
forbidden_modules =
    fpl.desugar
    fpl.ast_core
    fpl.eval
    fpl.types
    fpl.driver
    fpl.asm
allow_indirect_imports = False

[importlinter:contract:eval-sees-core-only]
name = eval.py and types.py only ever see the core AST
type = forbidden
source_modules =
    fpl.eval
    fpl.types
forbidden_modules =
    fpl.ast_surface
    fpl.parse
    fpl.desugar
    fpl.driver
    lark

[importlinter:contract:core-stands-alone]
name = the core AST depends on nothing but errors
type = forbidden
source_modules = fpl.ast_core
forbidden_modules =
    fpl.ast_surface
    fpl.parse
    fpl.desugar
    fpl.eval
    fpl.types
    fpl.driver
    fpl.asm
    lark

[importlinter:contract:driver-on-top]
name = only the entry points use the driver
type = forbidden
source_modules =
    fpl.errors
    fpl.parse
    fpl.ast_surface
    fpl.desugar
    fpl.ast_core
    fpl.eval
    fpl.types
forbidden_modules =
    fpl.driver
    fpl.__main__
    fpl.repl

[importlinter:contract:asm-stands-alone]
name = fpl.asm imports nothing from fpl outside fpl.asm
; fpl.* reaches every module of fpl, those added later too; import-linter skips the pairs
; where fpl.asm meets itself. It does not match fpl itself, whose __init__ imports nothing.
; Kept while fpl/asm does not exist.
type = forbidden_once_present
source_modules = fpl.asm
forbidden_modules = fpl.*
