# DRAFT of the smoke Action, kept here because an agent's token cannot push under
# .github/workflows (.agents/WORKFLOW.md, rule 8): the owner installs it (README.md).
#
# `nix run github:fpl-org/fpl` is the walker as a reader gets it. On every push to main, and
# once a week for what the push cannot see (the forge's archive, the binary cache), this asks
# the forge for that commit and runs scripts/smoke against it: the same four checks as
# `make smoke`, through the forge's copy of the flake rather than the checkout's. The checkout
# only supplies the script and the example it feeds the loop. The commit is pinned by SHA, so
# a later push cannot answer for this one. No secret; the token only reads.
name: smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: nix run github:fpl-org/fpl at this commit
        env:
          FLAKE: github:${{ github.repository }}/${{ github.sha }}
        run: scripts/smoke "$FLAKE"
