# harness/workflows/land.yml: a DRAFT of the lander, not live. Only the owner installs it
# under .github/workflows (README.md beside it); no agent token can push that path.
#
# A dispatch on main names a pull request. One run lands at most one pull request: that one
# when `scripts/land --ci` lets it, else the first other open pull request on main it lets,
# by number. It stops after the first push. The push to main starts the next run (the relay
# in series.yml dispatches it), since a single concurrency group drops the dispatches queued
# behind a running one.
#
# Both jobs check out the commit of main the dispatch started from, not the moving ref: what
# verify proved is what land runs with the key.
#
# Two jobs. verify holds no secret, no environment and no cache: it runs what can be checked
# without the key (today main's lander proving itself; the relocation of a stale head joins
# it later). land runs in the environment `land`, whose policy admits main alone, mints the
# fpl-lander App's token, and runs main's scripts/land with it: every rule, the fpl/series
# receipt, the fast-forward push as the App, then each child retargeted before the landed
# branch is deleted. Nothing of the pull request runs here.
name: land

on:
  workflow_dispatch:
    inputs:
      pr:
        description: the pull request to land first
        required: true
        type: number

concurrency:
  group: land
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: scripts/land-self-test

  land:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: land
    permissions:
      contents: read
    steps:
      - id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.LAND_APP_ID }}
          private-key: ${{ secrets.LAND_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: write
          permission-statuses: read
      # No persisted credential: scripts/land --ci gives the push the App's token itself,
      # and a second Authorization header would make GitHub refuse it.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: land the first pull request the rules let through
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          FPL_LAND_APP: ${{ steps.token.outputs.app-slug }}[bot]
          PR: ${{ inputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          others="$(gh api --hostname github.com --paginate \
            "repos/$REPO/pulls?state=open&base=main&per_page=100" \
            --jq '.[] | select(.draft | not) | .number' | sort -n | grep -vx "$PR" || :)"
          for n in $PR $others; do
            before="$(git ls-remote origin refs/heads/main | cut -f1)"
            if scripts/land --ci --remote origin "$n"; then
              echo "landed #$n" >>"$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # A refusal leaves main; a failure after the push does not: then stop, loud.
            [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$before" ] || exit 1
          done
          echo "nothing landed: every pull request was refused (the log names each rule)" \
            >>"$GITHUB_STEP_SUMMARY"
          exit 1
